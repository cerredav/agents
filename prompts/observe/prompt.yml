observe_prompt: |
  Determine whether the accumulated tool results are sufficient to answer the
  user's request completely and accurately. Consider that the current results
  may represent only one step of a larger operation.

  User request:
  {user_request}

  Tool-result context:
  {context}

  Set "complete" to true only when no additional tool call is needed. Otherwise,
  set it to false. In "reason", briefly identify the evidence that makes the
  request answerable or the specific information or operation still missing.

  Return only this JSON object, with no Markdown or explanatory text:
  {{"complete": false, "reason": "The specific missing information or operation."}}
