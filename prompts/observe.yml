observe_prompt: |
  Think step by step here. Given the user's request and the tool's output, you must decide if it is sufficient to answer the user's request. Use the context provided below knowing the tool's output could be part of a much larger operation needed to answer the user's request.

  If the tool's output is sufficient to answer the user's request, you must output True. If the tool's output is not sufficient to answer the user's request, you must output False.

  The tool's output is provided below.
  The current transcript of the conversation is below.
  {context}

  The user's request is provided below.
  {user_request}

  ONLY OUTPUT TRUE OR FALSE. DO NOT OUTPUT ANYTHING ELSE. DO NOT OUTPUT ANYTHING ELSE.
