name: get_routes
enabled: false
description: Get airline route metadata with optional pagination and filters
parameters: &route_parameters
  limit:
    type: int
    description: Maximum number of results to return (up to 100)
    required: false
  offset:
    type: int
    description: Number of results to skip for pagination
    required: false
  dep_iata:
    type: str
    description: Departure airport IATA code
    required: false
  dep_icao:
    type: str
    description: Departure airport ICAO code
    required: false
  arr_iata:
    type: str
    description: Arrival airport IATA code
    required: false
  arr_icao:
    type: str
    description: Arrival airport ICAO code
    required: false
  airline_iata:
    type: str
    description: Airline IATA code
    required: false
  airline_icao:
    type: str
    description: Airline ICAO code
    required: false
  flight_number:
    type: int
    description: Numeric flight number
    required: false
  flight_iata:
    type: str
    description: Flight IATA code-number
    required: false
  flight_icao:
    type: str
    description: Flight ICAO code-number
    required: false
callable:
  file: actions/routes.py
  function: get_routes
  description: Get airline route metadata with optional pagination and filters
  parameters: *route_parameters
