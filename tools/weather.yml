# This tool is used to get the weather for a given location
name: get_current_weather
description: Get the current weather for a given pair of latitude and longitude
parameters:
  latitude:
    type: int
    description: The latitude of the location to get the weather for
    required: true
  longitude:
    type: int
    description: The longitude of the location to get the weather for
    required: true
callable: 
  file: actions/weather.py
  function: get_weather
  description: Get the weather for a given location
  parameters:
    latitude:
      type: int
      description: The latitude of the location to get the weather for
      required: true
    longitude:
      type: int
      description: The longitude of the location to get the weather for
      required: true
  