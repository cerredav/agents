name: get_airport_timetable
description: Get a live airport arrival or departure timetable
parameters: &timetable_parameters
  iataCode:
    type: str
    description: IATA code of the airport whose timetable is requested
    required: true
  type:
    type: literal['arrival', 'departure']
    description: Timetable direction
    required: true
  status:
    type: literal['scheduled', 'active', 'landed', 'cancelled', 'unknown', 'diverted']
    description: Flight status to return
    required: false
  airline_name:
    type: str
    description: Airline name
    required: false
  airline_iata:
    type: str
    description: Airline IATA code
    required: false
  airline_icao:
    type: str
    description: Airline ICAO code
    required: false
  flight_num:
    type: int
    description: Numeric flight number
    required: false
  flight_iata:
    type: str
    description: Flight IATA code-number
    required: false
  flight_icao:
    type: str
    description: Flight ICAO code-number
    required: false
  codeshared:
    type: str
    description: Codeshare filter; use null to exclude codeshared flights
    required: false
callable:
  file: actions/aviation/airport_timetable.py
  function: get_airport_timetable
  description: Get a live airport arrival or departure timetable
  parameters: *timetable_parameters
