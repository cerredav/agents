name: lookup_entity
description: Look up a paginated Aviationstack entity catalog
parameters: &lookup_parameters
  type:
    type: literal['airport', 'airline', 'airplane', 'aircraft_type', 'city', 'country', 'taxes']
    description: Entity catalog to query
    required: true
  limit:
    type: int
    description: Maximum number of results to return (up to 100)
    required: false
  offset:
    type: int
    description: Number of results to skip for pagination
    required: false
callable:
  file: actions/aviation/lookup_entity.py
  function: lookup_entity
  description: Look up a paginated Aviationstack entity catalog
  parameters: *lookup_parameters
