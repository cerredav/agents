name: named_location_to_lat_lon_pair
description: Get the latitude and longitude for a given location name
parameters:
  location:
    type: str
    description: The location name to get the latitude and longitude for
    required: true
callable: 
  file: actions/geocode.py
  function: get_geocode
  description: Get the latitude and longitude for a given location name
  parameters:
    location:
      type: str
      description: The location name to get the latitude and longitude for
      required: true
