# Resolve a named location to coordinates and its nearest relevant airport
name: named_location_to_lat_lon_pair
description: Resolve a location to coordinates and its nearest relevant commercial airport and IATA code
parameters:
  location:
    type: str
    description: Location or airport name to resolve
    required: true
callable: 
  file: actions/geocode.py
  function: get_geocode
  description: Resolve a location to coordinates and nearest relevant commercial airport metadata
  parameters:
    location:
      type: str
      description: Location or airport name to resolve
      required: true
